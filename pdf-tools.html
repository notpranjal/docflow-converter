<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private browser-native PDF tools: merge, split, extract, rotate and image to PDF."><title>DocFlow PDF Toolkit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><style>:root{--bg:#07111f;--panel:#0d2136;--line:rgba(148,193,226,.16);--text:#f2f8ff;--muted:#91a8bc;--blue:#0ea5e9;--cyan:#42d9f5;--good:#54e5a5;--bad:#ff7590}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 0 0,#103a5a 0,transparent 30%),#07111f;color:var(--text);font:16px/1.5 'DM Sans',sans-serif}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.head{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 20px Sora;text-decoration:none;color:white}.brand b{color:var(--cyan)}.back{color:#b9d8e9;text-decoration:none;font-size:14px}.hero{padding:58px 0 48px;text-align:center}.eyebrow{color:var(--cyan);text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.13em}.hero h1{font:700 clamp(38px,6vw,64px)/1.08 Sora;margin:12px auto;letter-spacing:-.05em}.hero p{max-width:610px;margin:auto;color:var(--muted);font-size:18px}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding-bottom:70px}.group{padding:21px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(19,50,77,.72),rgba(8,22,38,.78))}.group h2{font:600 17px Sora;margin:0 0 13px}.tools{display:flex;flex-wrap:wrap;gap:7px}.tool{border:1px solid rgba(148,193,226,.15);border-radius:8px;background:rgba(4,15,27,.45);color:#c2d8e8;padding:7px 9px;font:500 12px 'DM Sans';cursor:pointer;transition:.2s}.tool:hover,.tool:focus{transform:translateY(-2px);border-color:var(--cyan);color:white;outline:none}.tool.ready:after{content:' · local';color:var(--good);font-size:10px}.tool.soon:after{content:' · soon';color:#8299ab;font-size:10px}.workspace{display:none;margin:0 auto 58px;max-width:780px;padding:22px;border:1px solid rgba(66,217,245,.28);border-radius:20px;background:rgba(10,29,48,.9);box-shadow:0 24px 70px rgba(0,0,0,.28)}.workspace.open{display:block}.workspace h2{font:600 24px Sora;margin:0}.workspace p{color:var(--muted);margin:5px 0 18px}.drop{display:block;padding:28px;border:1.5px dashed rgba(66,217,245,.45);border-radius:13px;text-align:center;cursor:pointer;background:rgba(5,18,31,.48);color:#c9e9f7}.drop strong{display:block;font:600 16px Sora}.drop small{color:var(--muted)}.files{display:grid;gap:7px;margin:12px 0}.file{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 11px;border-radius:9px;background:#071624;border:1px solid var(--line);font-size:13px}.file button{color:#ff9bb0;background:none;border:0;font-size:18px;cursor:pointer}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0}.options label{color:#c4d8e6;font-size:12px;font-weight:700}.options input,.options select{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#071624;color:white;font:14px 'DM Sans'}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.btn{padding:11px 15px;border:0;border-radius:9px;background:linear-gradient(100deg,var(--blue),var(--cyan));color:#022134;font:700 14px 'DM Sans';cursor:pointer}.btn.alt{background:transparent;border:1px solid var(--line);color:#bcd2df}.notice{padding:11px;border-radius:9px;background:rgba(14,165,233,.1);color:#b8eafa;font-size:13px}.toast{position:fixed;right:18px;bottom:18px;z-index:10;padding:13px 16px;background:#102b43;border:1px solid rgba(66,217,245,.4);border-radius:10px;box-shadow:0 16px 45px #0008;font-size:14px}.toast.bad{border-color:#ff7590}@media(max-width:760px){.tool-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.tool-grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.hero{padding-top:38px}.workspace{padding:15px}}</style></head><body><header class="wrap head"><a class="brand" href="index.html">Doc<b>Flow</b></a><a class="back" href="index.html">← Word to PDF</a></header><main class="wrap"><section class="hero"><span class="eyebrow">Private PDF toolkit</span><h1>Everyday PDF work, <span style="color:#42d9f5">kept local.</span></h1><p>Choose a tool to work with files in your browser. No uploads, no accounts, and no server copies.</p></section><section id="workspace" class="workspace" aria-live="polite"><h2 id="toolTitle">PDF tool</h2><p id="toolHelp"></p><label id="drop" class="drop" for="picker"><strong id="dropLabel">Select files</strong><small id="dropHint">or drag and drop them here</small><input id="picker" type="file" hidden multiple></label><div id="files" class="files"></div><div id="options" class="options"></div><div class="actions"><button class="btn alt" id="reset">Clear</button><button class="btn" id="run">Process PDF</button></div></section><section class="tool-grid" aria-label="PDF tools"><article class="group"><h2>Organize PDF</h2><div class="tools"><button class="tool ready" data-tool="merge">Merge PDF</button><button class="tool ready" data-tool="split">Split PDF</button><button class="tool ready" data-tool="remove">Remove pages</button><button class="tool ready" data-tool="extract">Extract pages</button><button class="tool soon">Organize PDF</button><button class="tool soon">Scan to PDF</button></div></article><article class="group"><h2>Optimize PDF</h2><div class="tools"><button class="tool soon">Compress PDF</button><button class="tool soon">Repair PDF</button><button class="tool soon">OCR PDF</button></div></article><article class="group"><h2>Convert to PDF</h2><div class="tools"><button class="tool ready" data-tool="image">JPG to PDF</button><button class="tool ready" data-tool="word">WORD to PDF</button><button class="tool soon">POWERPOINT to PDF</button><button class="tool soon">EXCEL to PDF</button><button class="tool soon">HTML to PDF</button></div></article><article class="group"><h2>Convert from PDF</h2><div class="tools"><button class="tool soon">PDF to JPG</button><button class="tool soon">PDF to WORD</button><button class="tool soon">PDF to POWERPOINT</button><button class="tool soon">PDF to EXCEL</button><button class="tool soon">PDF to PDF/A</button></div></article><article class="group"><h2>Edit PDF</h2><div class="tools"><button class="tool ready" data-tool="rotate">Rotate PDF</button><button class="tool soon">Add page numbers</button><button class="tool soon">Add watermark</button><button class="tool soon">Crop PDF</button><button class="tool soon">Edit PDF</button><button class="tool soon">PDF Forms</button></div></article><article class="group"><h2>PDF security</h2><div class="tools"><button class="tool soon">Unlock PDF</button><button class="tool soon">Protect PDF</button><button class="tool soon">Sign PDF</button><button class="tool soon">Redact PDF</button><button class="tool soon">Compare PDF</button></div></article><article class="group"><h2>PDF Intelligence</h2><div class="tools"><button class="tool soon">AI Summarizer</button><button class="tool soon">Translate PDF</button><button class="tool soon">PDF to Markdown</button></div></article></section></main><script>(()=>{const $=x=>document.getElementById(x),ws=$('workspace'),picker=$('picker'),drop=$('drop'),files=$('files'),opts=$('options');let chosen=[],mode='';const cfg={merge:{title:'Merge PDF',help:'Choose two or more PDFs and download a single combined file.',accept:'.pdf',multiple:true},split:{title:'Split PDF',help:'Split one PDF into individual page PDFs.',accept:'.pdf',multiple:false},remove:{title:'Remove pages',help:'Remove selected pages from one PDF. Use page ranges like 2, 5-7.',accept:'.pdf',multiple:false,field:'Pages to remove',placeholder:'Example: 2, 5-7'},extract:{title:'Extract pages',help:'Create a new PDF with only the selected pages.',accept:'.pdf',multiple:false,field:'Pages to extract',placeholder:'Example: 1, 3-5'},rotate:{title:'Rotate PDF',help:'Rotate every page in a PDF and save a new copy.',accept:'.pdf',multiple:false,field:'Rotation',placeholder:'90'},image:{title:'JPG to PDF',help:'Turn JPG or PNG images into a share-ready PDF.',accept:'.jpg,.jpeg,.png',multiple:true},word:{title:'WORD to PDF',help:'Use DocFlow’s full Word converter for DOC, DOCX, and ODT files.',accept:'.doc,.docx,.odt',multiple:true}};function msg(t,b=false){let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast'+(b?' bad':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3800)}function redraw(){files.innerHTML=chosen.map((f,i)=>`<div class="file"><span>${f.name} <small style="color:#91a8bc">(${(f.size/1048576).toFixed(1)} MB)</small></span><button data-i="${i}" aria-label="Remove">×</button></div>`).join('');files.querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen.splice(+b.dataset.i,1);redraw()})}function choose(fs){const c=cfg[mode];chosen=[...fs].filter(f=>f.size<=20*1048576);if(!c.multiple)chosen=chosen.slice(0,1);if(!chosen.length)msg('Choose a supported file under 20 MB.',true);redraw()}function ranges(s,max){let a=[];for(const bit of s.split(',').map(x=>x.trim()).filter(Boolean)){let [x,y]=bit.split('-').map(n=>+n.trim());if(!x||!y&&bit.includes('-'))throw Error('Use page numbers like 1, 3-5.');y=y||x;for(let i=x;i<=y;i++)if(i>0&&i<=max&&!a.includes(i))a.push(i)}return a.sort((a,b)=>a-b)}function open(m){mode=m;const c=cfg[m];ws.classList.add('open');$('toolTitle').textContent=c.title;$('toolHelp').textContent=c.help;$('dropLabel').textContent=c.multiple?'Select files':'Select a file';$('dropHint').textContent=`Accepted: ${c.accept} · max 20 MB`;picker.accept=c.accept;picker.multiple=c.multiple;chosen=[];opts.innerHTML=c.field?`<label>${c.field}<input id="range" placeholder="${c.placeholder}"></label>`:'';redraw();ws.scrollIntoView({behavior:'smooth',block:'start'})}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{if(b.dataset.tool==='word'){location.href='index.html';return}open(b.dataset.tool)});document.querySelectorAll('.soon').forEach(b=>b.onclick=()=>msg(`${b.textContent} is planned for a future browser-native release.`));picker.onchange=e=>{choose(e.target.files);picker.value=''};['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.style.borderColor='#42d9f5'}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.style.borderColor=''}));drop.addEventListener('drop',e=>choose(e.dataTransfer.files));$('reset').onclick=()=>{chosen=[];redraw()};async function download(pdf,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await pdf.save()],{type:'application/pdf'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);msg(`${name} is ready to download.`)}$('run').onclick=async()=>{try{if(!chosen.length)throw Error('Select a file first.');if(mode==='merge'){if(chosen.length<2)throw Error('Choose at least two PDFs.');const out=await PDFLib.PDFDocument.create();for(const f of chosen){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}await download(out,'merged-docflow.pdf')}else if(mode==='split'){const src=await PDFLib.PDFDocument.load(await chosen[0].arrayBuffer());for(let i=0;i<src.getPageCount();i++){const out=await PDFLib.PDFDocument.create();const [p]=await out.copyPages(src,[i]);out.addPage(p);await download(out,`page-${i+1}.pdf`)}msg('Each page is downloading as its own PDF.')}else if(mode==='remove'||mode==='extract'){const src=await PDFLib.PDFDocument.load(await chosen[0].arrayBuffer());const r=ranges($('range').value,src.getPageCount());if(!r.length)throw Error('Enter at least one valid page number.');const wanted=mode==='extract'?r:src.getPageIndices().map(i=>i+1).filter(x=>!r.includes(x));if(!wanted.length)throw Error('At least one page must remain.');const out=await PDFLib.PDFDocument.create();const pages=await out.copyPages(src,wanted.map(x=>x-1));pages.forEach(p=>out.addPage(p));await download(out,mode==='extract'?'extracted-pages.pdf':'pages-removed.pdf')}else if(mode==='rotate'){const src=await PDFLib.PDFDocument.load(await chosen[0].arrayBuffer());const deg=+($('range').value||90);if(![90,180,270].includes(deg))throw Error('Choose 90, 180, or 270 degrees.');src.getPages().forEach(p=>p.setRotation(PDFLib.degrees((p.getRotation().angle+deg)%360)));await download(src,'rotated.pdf')}else if(mode==='image'){const out=await PDFLib.PDFDocument.create();for(const f of chosen){const bytes=await f.arrayBuffer(),img=/png$/i.test(f.name)?await out.embedPng(bytes):await out.embedJpg(bytes),page=out.addPage([img.width,img.height]);page.drawImage(img,{x:0,y:0,width:img.width,height:img.height})}await download(out,'images-docflow.pdf')}}catch(e){msg(e.message||'Could not process this file.',true)}})();</script></body></html>
